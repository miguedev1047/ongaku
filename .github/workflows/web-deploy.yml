name: Web Deploy

on:
  push:
    branches:
      - master
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/assets/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/config/**"
      - "packages/assets/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Lint workspaces
        run: bun run lint

      - name: Build Web
        run: bun run build:web

  deploy:
    name: Deploy Web
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web
        run: bun run build:web

      - name: Deploy Web to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          wranglerVersion: "4"
          command: deploy

      - name: Publish deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Deployed to [$DEPLOYMENT_URL]($DEPLOYMENT_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No deployment URL was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
