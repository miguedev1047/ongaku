[package]
name = "ongaku"
version = "0.1.4"
description = "A lightweight and simple mp3 player"
authors = ["miguedev1047"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["process"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tower = { version = "0.5.3", features = ["util"] }
lofty = "0.25.4"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
yt-dlp = { version = "2.8", features = ["statistics"] }
tauri-plugin-process = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
